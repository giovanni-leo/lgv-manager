# Same file for local use and for the Swiss server; only .env changes.
name: vc-manager

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vc}
      POSTGRES_USER: ${POSTGRES_USER:-vc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published on the host. Use `docker compose exec db psql -U vc vc`,
    # or uncomment to reach it through an SSH tunnel on 127.0.0.1.
    # ports: ["127.0.0.1:5432:5432"]

  app:
    build: .
    image: lgv-manager:latest
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    volumes:
      - media:/data/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Runs Claude jobs (web research, email analysis) and reads the intake mailbox.
  worker:
    image: lgv-manager:latest
    restart: unless-stopped
    command: ["python", "manage.py", "run_worker"]
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      RUN_MIGRATIONS: "0"
    volumes:
      - media:/data/media
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Host ports: 80/443 on a dedicated server. On a machine where they are taken
    # (e.g. Umbrel), set HTTP_PORT/HTTPS_PORT in .env and forward the router's
    # external 80/443 to them so HTTPS certificates still work.
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
